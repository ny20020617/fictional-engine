<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17171b">
  <meta name="description" content="あんさんぶるスターズ！！非公式・ファン制作の好き顔ランキング">
  <title>あんスタ好き顔9選</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <main class="app">
    <section id="start" class="screen active">
      <div class="eyebrow">ENSEMBLE STARS!! / FAN MADE</div>
      <h1>あんスタ<br><span>好き顔9選</span></h1>
      <p class="lead">あんスタのキャラクターから<br>「顔が好き」な9人を選ぼう。</p>
      <div class="note">※非公式のファン制作コンテンツです</div>
      <button class="primary" id="startBtn">START</button>
    </section>

    <section id="select" class="screen">
      <div class="topbar">
        <div>
          <div class="eyebrow">QUALIFYING</div>
          <h2>好きな顔を選択</h2>
        </div>
        <div class="counter"><b id="selectedCount">0</b> 人</div>
      </div>
      <p class="instruction">気になるキャラクターをタップ。複数選択できます。</p>
      <div id="characterGrid" class="character-grid"></div>
      <div class="bottom-action">
        <button class="primary" id="toBattleBtn" disabled>選択を確定</button>
      </div>
    </section>

    <section id="battle" class="screen">
      <div class="eyebrow">FINAL SELECTION</div>
      <h2>どっちの顔が好き？</h2>
      <div class="battle-meta"><span id="battleNo">1</span> / <span id="battleTotal">1</span></div>
      <div id="battleCards" class="battle-cards"></div>
      <button class="ghost" id="skipBattleBtn">今回は選ばない</button>
    </section>

    <section id="result" class="screen">
      <div class="eyebrow">YOUR FAVORITE 9</div>
      <h1>好き顔<br><span>TOP 9</span></h1>
      <div id="resultList" class="result-list"></div>
      <div class="result-actions">
        <button class="primary" id="shareBtn">結果をコピー</button>
        <button class="ghost" id="retryBtn">もう一度遊ぶ</button>
      </div>
      <p id="copyStatus" class="copy-status"></p>
      <p class="copyright">本サイトは非公式のファン制作コンテンツです。<br>© Happy Elements K.K</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
